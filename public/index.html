<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fitbit Health Dashboard</title>
  <link rel="stylesheet" href="/app.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

  <div class="container">
    <header>
      <h1>Fitbit Health</h1>
      <div>
        <span id="syncStatus" class="sync-status"></span>
        <button id="syncBtn" class="btn">
          <span class="icon">🔄</span> Sync Now
        </button>
      </div>
    </header>

    <div id="connectSection" class="connect-prompt hidden">
      <h2>Welcome Back</h2>
      <p style="color: var(--text-secondary); margin: 1rem 0 2rem;">Connect your Fitbit account to visualize your health
        trends.</p>
      <a href="/fitbit/auth" class="btn">Connect Fitbit Account</a>
    </div>

    <div id="dashboardSection" class="hidden">
      <div class="dashboard-grid">
        <div class="card">
          <div class="card-title">Resting Heart Rate <span style="font-size:0.8rem">30 Days</span></div>
          <canvas id="chartHR"></canvas>
        </div>
        <div class="card">
          <div class="card-title">Sleep Duration <span style="font-size:0.8rem">hrs</span></div>
          <canvas id="chartSleep"></canvas>
        </div>
        <div class="card">
          <div class="card-title">HRV (RMSSD) <span style="font-size:0.8rem">ms</span></div>
          <canvas id="chartHRV"></canvas>
        </div>
      </div>

      <!-- Quick Stats Tests -->
      <!-- <div class="card" style="margin-top: 2rem;">
        <h3>Today (Quick View)</h3>
        <div id="todaySummary" class="metric-grid"></div>
      </div> -->

    </div>
  </div>

  <!-- Day Details Modal -->
  <div id="dayModal" class="modal-overlay">
    <div class="modal-content">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5rem;">
        <h2 id="modalDate"></h2>
        <button id="closeModal" class="btn-secondary" style="padding:0.4rem 0.8rem;">✕</button>
      </div>

      <div id="modalMetrics" class="metric-grid">
        <!-- Injected via JS -->
      </div>

      <div id="modalRaw"
        style="font-family: monospace; font-size: 0.8rem; background: #eee; padding: 1rem; border-radius: 8px; overflow-x: auto; display: none;">
      </div>
    </div>
  </div>

  <div id="toastBucket" class="toast-container"></div>

  <script src="/app.js"></script>
</body>

</html>
