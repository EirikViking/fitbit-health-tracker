<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fitbit Data Catalog</title>
  <link rel="stylesheet" href="/app.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    .catalog-header {
      text-align: center;
      margin-bottom: var(--spacing-lg);
    }

    .catalog-subtitle {
      color: var(--text-secondary);
      margin-top: var(--spacing-xs);
    }

    .catalog-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: var(--spacing-md);
    }

    .catalog-card {
      display: flex;
      flex-direction: column;
      gap: var(--spacing-sm);
    }

    .catalog-row {
      display: flex;
      justify-content: space-between;
      gap: var(--spacing-sm);
      flex-wrap: wrap;
    }

    .catalog-label {
      font-size: 0.75rem;
      color: var(--text-tertiary);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: var(--font-weight-semibold);
    }

    .catalog-value {
      font-size: 0.9rem;
      color: var(--text-primary);
    }

    .catalog-endpoint {
      font-size: 0.75rem;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-sm);
      padding: 0.4rem 0.6rem;
      display: inline-block;
      word-break: break-all;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      padding: 0.2rem 0.5rem;
      border-radius: var(--radius-sm);
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      font-size: 0.7rem;
      color: var(--text-secondary);
      margin: 0.2rem 0.2rem 0 0;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: var(--spacing-md);
      margin-bottom: var(--spacing-lg);
    }

    .summary-value {
      font-size: 1.6rem;
      font-weight: var(--font-weight-bold);
      color: var(--text-primary);
      line-height: 1.1;
    }

    .summary-label {
      font-size: 0.8rem;
      color: var(--text-tertiary);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: var(--font-weight-semibold);
    }

    .back-link {
      margin-top: var(--spacing-sm);
      display: inline-flex;
    }

    .status-text {
      font-size: 0.85rem;
      color: var(--text-secondary);
      margin-top: var(--spacing-sm);
    }
  </style>
</head>

<body>
  <button id="themeToggle" class="theme-toggle" aria-label="Toggle theme">
    <span class="theme-icon">T</span>
  </button>

  <div class="container">
    <header class="hero-header catalog-header">
      <h1 class="hero-title">Fitbit Data Catalog</h1>
      <p class="catalog-subtitle">Inventory of Fitbit resources currently fetched or fetchable with existing scopes.</p>
      <a class="btn-secondary back-link" href="/">Back to Dashboard</a>
    </header>

    <section class="summary-grid" id="catalogSummary">
      <div class="card">
        <div class="summary-label">Coverage Window</div>
        <div class="summary-value" id="summaryRange">--</div>
        <div class="status-text" id="summaryDays">--</div>
      </div>
      <div class="card">
        <div class="summary-label">Resources</div>
        <div class="summary-value" id="summaryResources">--</div>
        <div class="status-text">Catalog entries</div>
      </div>
      <div class="card">
        <div class="summary-label">Last Updated</div>
        <div class="summary-value" id="summaryUpdated">--</div>
        <div class="status-text">Across resources</div>
      </div>
    </section>

    <section id="catalogError" class="card hidden">
      <div class="card-title">Catalog Status</div>
      <div class="status-text" id="catalogErrorText">Unable to load catalog.</div>
    </section>

    <section class="catalog-grid" id="catalogList"></section>
  </div>

  <script src="/catalog.js"></script>
</body>

</html>
